<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Null7z — 4K Wallpapers</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #030405;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(3,4,5,.86);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid #181b20;
}

.nav {
    max-width: 1500px;
    margin: auto;

    padding: 17px 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 28px;
    font-weight: 950;
    letter-spacing: -1px;
}

.logo span {
    color: #8b5cf6;
}

.counter {
    color: #777;
    border: 1px solid #24272d;
    padding: 8px 13px;
    border-radius: 50px;
    font-size: 12px;
}

.hero {
    max-width: 1500px;
    margin: auto;

    padding: 65px 5% 35px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(50px,8vw,100px);
    line-height: .88;

    letter-spacing: -6px;
}

.hero h1 span {
    color: #8b5cf6;
}

.hero p {
    max-width: 700px;

    color: #85868b;

    line-height: 1.7;

    margin-top: 25px;
}

.search {
    max-width: 1500px;
    margin: auto;

    padding: 0 5% 20px;
}

.search input {
    width: 100%;

    padding: 17px 20px;

    background: #090a0d;

    border: 1px solid #24272e;

    border-radius: 14px;

    color: #fff;

    outline: none;

    font-size: 15px;
}

.search input:focus {
    border-color: #8b5cf6;
}

.devices,
.categories {
    max-width: 1500px;
    margin: auto;

    padding-left: 5%;
    padding-right: 5%;
}

.devices {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;

    padding-bottom: 13px;
}

.categories {
    display: flex;
    gap: 8px;

    overflow-x: auto;

    padding-bottom: 28px;
}

button {
    font: inherit;
}

.device,
.category {
    cursor: pointer;

    background: #0a0b0e;

    border: 1px solid #24272e;

    color: #999;

    border-radius: 11px;

    transition: .2s;
}

.device {
    padding: 12px 17px;
}

.category {
    white-space: nowrap;
    padding: 9px 14px;
}

.device:hover,
.device.active,
.category:hover,
.category.active {
    color: #fff;
    background: #8b5cf6;
    border-color: #8b5cf6;
}

.grid {
    max-width: 1500px;

    margin: auto;

    padding: 0 5% 40px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));

    gap: 15px;
}

.card {
    position: relative;

    height: 390px;

    overflow: hidden;

    border-radius: 18px;

    background: #08090b;

    border: 1px solid #1a1c22;

    cursor: pointer;
}

.card.phone {
    height: 430px;
}

.card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: .45s;
}

.card:hover img {
    transform: scale(1.05);
    filter: brightness(.7);
}

.card::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 50%;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.95)
        );
}

.info {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2;

    padding: 22px 16px;
}

.title {
    font-size: 17px;
    font-weight: 800;
}

.meta {
    color: #aaa;

    font-size: 10px;

    margin-top: 7px;
}

.loadBox {
    text-align: center;

    padding: 10px 20px 70px;
}

.load {
    border: 0;

    background: #8b5cf6;

    color: white;

    padding: 14px 24px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 700;
}

.load:hover {
    background: #7545e8;
}

.modal {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.97);

    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal img {
    max-width: 96vw;
    max-height: 92vh;

    object-fit: contain;

    border-radius: 10px;
}

.close {
    position: fixed;

    top: 18px;
    right: 18px;

    width: 48px;
    height: 48px;

    border: 0;

    border-radius: 50%;

    background: #17191e;

    color: white;

    font-size: 30px;

    cursor: pointer;

    z-index: 10;
}

.close:hover {
    background: #8b5cf6;
}

footer {
    border-top: 1px solid #181b20;

    text-align: center;

    padding: 30px;

    color: #555;

    font-size: 12px;
}

@media(max-width:600px) {

    .nav {
        padding: 15px 20px;
    }

    .counter {
        display: none;
    }

    .hero {
        padding: 45px 20px 30px;
    }

    .hero h1 {
        font-size: 54px;
        letter-spacing: -4px;
    }

    .search {
        padding-left: 20px;
        padding-right: 20px;
    }

    .devices,
    .categories {
        padding-left: 20px;
        padding-right: 20px;
    }

    .grid {
        padding-left: 12px;
        padding-right: 12px;

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap: 9px;
    }

    .card {
        height: 300px;
        border-radius: 14px;
    }

    .card.phone {
        height: 340px;
    }

    .info {
        padding: 15px 11px;
    }

    .title {
        font-size: 13px;
    }

    .meta {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
Null<span>7z</span>
</div>

<div class="counter">
50 000 ОБОЕВ
</div>

</div>

</header>


<section class="hero">

<h1>
Твой экран.<br>
<span>Твой стиль.</span>
</h1>

<p>
50 000 генерируемых обоев для Samsung,
Apple и PC. Выбирай устройство и получай
отдельный формат изображения.
</p>

</section>


<div class="search">

<input
id="search"
type="search"
placeholder="Поиск: горы, космос, ночь..."
>

</div>


<div class="devices">

<button class="device active" data-device="all">

</button>

<button class="device" data-device="samsung">
📱 Samsung

<button class="device" data-device="apple">

<button class="category active" data-category="all">

</button>

</button>

<button class="category" data-category="cars">

</button>

</button>

<main
id="grid"

</main>


<div class="loadBox">

id="load"

Показать ещё

</div>


<footer>
Null7z © 2026 • 50 000 Wallpapers
</footer>

id="modal"
class="modal">

id="close"
class="close">
×
</button>

<img
id="big"
alt="4K Wallpaper"
>

</div>


<script>

/* =====================================================
   NULL7Z WALLPAPER ENGINE
===================================================== */

const TOTAL = 50000;

const PER_PAGE = 36;

let shown = PER_PAGE;

let selectedDevice = "all";

let selectedCategory = "all";

let searchText = "";


/* =====================================================
   DEVICE
===================================================== */

function deviceFor(id) {

    const n = id % 3;

    if (n === 0) return "samsung";

    if (n === 1) return "apple";

    return "pc";
}


/* =====================================================
   CATEGORY
===================================================== */

function categoryFor(id) {

    const n = id % 7;

    if (n === 0) return "mountains";

    if (n === 1) return "space";

    if (n === 2) return "nature";

    if (n === 3) return "city";

    if (n === 4) return "cars";

    if (n === 5) return "dark";

    return "mountains";
}


/* =====================================================
   TITLES
===================================================== */

const titles = {

    mountains: [
        "Purple Mountains",
        "Snow Mountains",
        "Golden Peaks",
        "Dark Mountains",
        "Misty Mountains",
        "Moon Mountains",
        "Frozen Peaks",
        "Red Mountains"
    ],

    space: [
        "Deep Space",
        "Purple Galaxy",
        "Blue Nebula",
        "Dark Universe",
        "Cosmic Night",
        "Star Field"
    ],

    nature: [
        "Wild Forest",
        "Misty Forest",
        "Green Valley",
        "Mountain Lake",
        "Ocean",
        "Sunset"
    ],

    city: [
        "Neon City",
        "Night Street",
        "Future City",
        "Tokyo Night",
        "City Lights"
    ],

    cars: [
        "Black Supercar",
        "Night Drive",
        "Street Racer",
        "Luxury",
        "Midnight Car"
    ],

    dark: [
        "Black Minimal",
        "Dark Glass",
        "Black Wave",
        "Shadow",
        "Midnight"
    ]

};


function titleFor(category,id) {

    const list = titles[category];

    return list[id % list.length];

}


/* =====================================================
   SEEDED RANDOM
===================================================== */

function random(seed) {

    const x =
        Math.sin(seed * 12.9898) *
        43758.5453;

    return x - Math.floor(x);

}


/* =====================================================
   GENERATE SVG WALLPAPER
=====================================================

   ВАЖНО:

   Это настоящая генерация.

   Картинка не берётся из Picsum.

   Для каждого номера создаётся свой SVG.

===================================================== */

function generateWallpaper(id, device, category) {

    let width;
    let height;


    /* ТЕЛЕФОН */

    if (
        device === "samsung" ||
        device === "apple"
    ) {

        width = 1440;
        height = 3200;

    }


    /* PC */

    else {

        width = 3840;
        height = 2160;

    }


    const r1 = random(id * 2);
    const r2 = random(id * 5);
    const r3 = random(id * 9);


    let colors;


    if (category === "mountains") {

        colors = [
            "#03050b",
            "#10152b",
            "#3b2368",
            "#8b5cf6"
        ];

    }

    else if (category === "space") {

        colors = [
            "#020208",
            "#09052a",
            "#32116b",
            "#7928ca"
        ];

    }

    else if (category === "nature") {

        colors = [
            "#020806",
            "#09251b",
            "#145c43",
            "#50b27c"
        ];

    }

    else if (category === "city") {

        colors = [
            "#030308",
            "#10102a",
            "#32146b",
            "#8b5cf6"
        ];

    }

    else if (category === "cars") {

        colors = [
            "#020202",
            "#121212",
            "#300b18",
            "#e11d48"
        ];

    }

    else {

        colors = [
            "#010101",
            "#080808",
            "#171717",
            "#444444"
        ];

    }


    /* =================================================
       MOUNTAINS
    ================================================= */

    if (category === "mountains") {

        let mountains = "";

        const layers = 6;


        for (
            let layer = 0;
            layer < layers;
            layer++
        ) {

            const base =
                height * (
                    .48 +
                    layer * .09
                );

            const points = [];

            const peaks = 13;


            for (
                let p = 0;
                p <= peaks;
                p++
            ) {

                const x =
                    (width / peaks) * p;

                const variation =
                    random(
                        id +
                        layer * 100 +
                        p * 31
                    );

                const peak =
                    base -
                    variation *
                    height *
                    .35;

                points.push(
                    `${x},${peak}`
                );

            }


            points.push(
                `${width},${height}`
            );

            points.push(
                `0,${height}`
            );


            mountains += `
            <polygon
                points="${points.join(" ")}"
                fill="${colors[
                    Math.min(
                        layer,
                        colors.length - 1
                    )
                ]}"
                opacity="${.95 - layer*.08}"
            />
            `;


            /* СНЕГ */

            if (layer < 3) {

                const snowPoints = [];

                for (
                    let p = 0;
                    p <= peaks;
                    p++
                ) {

                    const x =
                        (width / peaks) * p;

                    const variation =
                        random(
                            id +
                            layer * 100 +
                            p * 31
                        );

                    const peak =
                        base -
                        variation *
                        height *
                        .35;

                    snowPoints.push(
                        `${x},${peak}`
                    );

                }

                mountains += `
                <polyline
                    points="${snowPoints.join(" ")}"
                    fill="none"
                    stroke="#ffffff"
                    stroke-opacity=".18"
                    stroke-width="${width/180}"
                />
                `;

            }

        }


        return `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${width}"
            height="${height}"
            viewBox="0 0 ${width} ${height}">

            <defs>

                <linearGradient
                    id="sky"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

                    <stop
                        offset="0%"
                        stop-color="${colors[0]}"
                    />

                    <stop
                        offset="55%"
                        stop-color="${colors[1]}"
                    />

                    <stop
                        offset="100%"
                        stop-color="${colors[2]}"
                    />

                </linearGradient>

                <radialGradient id="sun">

                    <stop
                        offset="0%"
                        stop-color="#ffffff"
                        stop-opacity=".95"
                    />

                    <stop
                        offset="45%"
                        stop-color="#d8b4fe"
                        stop-opacity=".3"
                    />

                    <stop
                        offset="100%"
                        stop-color="#8b5cf6"
                        stop-opacity="0"
                    />

                </radialGradient>

            </defs>


            <rect
                width="100%"
                height="100%"
                fill="url(#sky)"
            />


            <circle
                cx="${width * (.2 + r1*.6)}"
                cy="${height * (.18 + r2*.2)}"
                r="${width*.12}"
                fill="url(#sun)"
            />


            ${mountains}


            <rect
                width="100%"
                height="100%"
                fill="#000"
                opacity=".12"
            />

        </svg>
        `;

    }


    /* =================================================
       OTHER WALLPAPERS
    ================================================= */

    let circles = "";

    for (let i = 0; i < 35; i++) {

        const x =
            random(id * 10 + i) * width;

        const y =
            random(id * 20 + i) * height;

        const size =
            width *
            (.01 + random(id*30+i)*.08);

        circles += `
        <circle
            cx="${x}"
            cy="${y}"
            r="${size}"
            fill="${colors[i % colors.length]}"
            opacity=".18"
        />
        `;

    }


    return `
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${width}"
        height="${height}"
        viewBox="0 0 ${width} ${height}">

        <defs>

            <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="${colors[0]}"
                />

                <stop
                    offset="50%"
                    stop-color="${colors[1]}"
                />

                <stop
                    offset="100%"
                    stop-color="${colors[2]}"
                />

            </linearGradient>

            <filter id="blur">

                <feGaussianBlur
                    stdDeviation="${width/70}"
                />

            </filter>

        </defs>


        <rect
            width="100%"
            height="100%"
            fill="url(#bg)"
        />


        <g filter="url(#blur)">
            ${circles}
        </g>


        <circle
            cx="${width*r1}"
            cy="${height*r2}"
            r="${width*.12}"
            fill="${colors[3]}"
            opacity=".25"
            filter="url(#blur)"
        />


        <circle
            cx="${width*r3}"
            cy="${height*(1-r1)}"
            r="${width*.08}"
            fill="#ffffff"
            opacity=".08"
            filter="url(#blur)"
        />

    </svg>
    `;

}


/* =====================================================
   SVG → DATA URL
===================================================== */

function wallpaperURL(
    id,
    device,
    category
) {

    const svg =
        generateWallpaper(
            id,
            device,
            category
        );


    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

}


/* =====================================================
   FIND ITEMS
===================================================== */

function getItems() {

    const items = [];


    for (
        let id = 1;
        id <= TOTAL;
        id++
    ) {

        const itemDevice =
            deviceFor(id);

        const itemCategory =
            categoryFor(id);

        const title =
            titleFor(
                itemCategory,
                id
            );


        if (
            selectedDevice !== "all" &&
            itemDevice !== selectedDevice
        ) {
            continue;
        }


        if (
            selectedCategory !== "all" &&
            itemCategory !== selectedCategory
        ) {
            continue;
        }


        if (
            searchText &&
            !title
                .toLowerCase()
                .includes(
                    searchText
                    .toLowerCase()
                )
        ) {
            continue;
        }


        items.push({

            id,

            device: itemDevice,

            category: itemCategory,

            title,

            url:
                wallpaperURL(
                    id,
                    itemDevice,
                    itemCategory
                )

        });


        if (
            items.length >= shown
        ) {
            break;
        }

    }


    return items;

}


/* =====================================================
   RENDER
===================================================== */

const grid =
    document.getElementById("grid");


function render() {

    grid.innerHTML = "";


    const items =
        getItems
