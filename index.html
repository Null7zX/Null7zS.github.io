<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Null7z — обои для Samsung, Apple и PC</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --bg2:#111119;
    --surface:#16161f;
    --surface2:#1d1d29;
    --line:#26263380;
    --text:#f2f2f7;
    --muted:#8b8ba0;
    --accent:#ff3ea5;
    --accent2:#7c5cff;
    --accent-glow:#ff3ea533;
    --radius:14px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 12% -10%, #7c5cff22, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #ff3ea522, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
  }
  a{color:inherit}
  ::selection{background:var(--accent);color:#0a0a0f}

  /* Header */
  header{
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(14px);
    background:#0a0a0fcc;
    border-bottom:1px solid var(--line);
  }
  .headbar{
    max-width:1180px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{
    font-family:var(--font-display); font-weight:800; font-size:22px;
    letter-spacing:-0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 14px var(--accent-glow);
  }
  .stat{
    font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;
  }

  /* Hero */
  .hero{
    max-width:1180px; margin:0 auto; padding:64px 24px 32px;
  }
  .hero h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(32px,5vw,54px);
    line-height:1.05; letter-spacing:-0.02em; margin:0 0 14px;
    max-width:14ch;
  }
  .hero p{
    color:var(--muted); font-size:17px; max-width:46ch; margin:0 0 30px;
  }

  /* Search */
  .search{
    position:relative; max-width:520px;
  }
  .search input{
    width:100%; padding:14px 16px 14px 44px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:999px; color:var(--text); font-size:15px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-glow); }
  .search input::placeholder{color:var(--muted)}
  .search svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); opacity:.6}

  /* Filter bar */
  .filters{
    max-width:1180px; margin:0 auto; padding:8px 24px 28px;
    display:flex; flex-direction:column; gap:16px;
  }
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .row-label{font-size:12px; color:var(--muted); min-width:72px}
  .chip{
    appearance:none; border:1px solid var(--line); background:var(--surface);
    color:var(--text); padding:9px 16px; border-radius:999px; font-size:14px;
    cursor:pointer; transition:all .15s; font-family:var(--font-body);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip:hover{border-color:#3a3a4a}
  .chip.active{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent; color:#0a0a0f; font-weight:600;
  }

  /* Grid */
  main{max-width:1180px; margin:0 auto; padding:0 24px 80px;}
  .grid{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  }
  .card{
    position:relative; border-radius:var(--radius); overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
    cursor:pointer;
  }
  .card img{
    width:100%; height:100%; object-fit:cover; display:block;
    background:var(--surface2);
  }
  .card.phone{aspect-ratio:9/17.5}
  .card.pc{aspect-ratio:16/9.5}
  .card .overlay{
    position:absolute; inset:0;
    background:linear-gradient(to top, #000000cc 0%, transparent 42%);
    opacity:0; transition:opacity .18s;
    display:flex; flex-direction:column; justify-content:flex-end; padding:12px;
  }
  .card:hover .overlay{opacity:1}
  .card:hover img{filter:brightness(.92)}
  .card .tag{
    font-size:11px; color:var(--text); background:#00000080; backdrop-filter:blur(6px);
    padding:4px 9px; border-radius:999px; align-self:flex-start; margin-bottom:8px;
    border:1px solid #ffffff22;
  }
  .card .meta{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:#e8e8ef;
  }
  .dl{
    background:#ffffffe6; color:#0a0a0f; border:none; border-radius:8px;
    padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer;
    font-family:var(--font-body);
  }
  .dl:hover{background:#fff}

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
  }

  .more-wrap{display:flex; justify-content:center; margin-top:36px;}
  .more{
    padding:14px 30px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); font-size:14px; cursor:pointer;
    font-family:var(--font-body); transition:border-color .15s;
  }
  .more:hover{border-color:var(--accent)}
  .more:disabled{opacity:.5; cursor:default}

  footer{
    border-top:1px solid var(--line); padding:28px 24px; text-align:center;
    color:var(--muted); font-size:13px;
  }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:#000000e6; z-index:100;
    display:none; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(6px);
  }
  .lightbox.open{display:flex}
  .lightbox img{max-width:min(90vw,760px); max-height:82vh; border-radius:10px; box-shadow:0 20px 60px #000a;}
  .lightbox .close{
    position:absolute; top:22px; right:26px; background:none; border:none;
    color:#fff; font-size:28px; cursor:pointer; line-height:1;
  }
  .lightbox .actions{
    position:absolute; bottom:30px; display:flex; gap:10px;
  }
  .lightbox .actions button{
    padding:10px 20px; border-radius:999px; border:none; font-size:14px;
    cursor:pointer; font-family:var(--font-body); font-weight:600;
  }
  .lightbox .actions .dl2{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0a0f;}
  .lightbox .actions .close2{background:#ffffff1a; color:#fff; border:1px solid #ffffff33;}

  @media (max-width:640px){
    .row{gap:8px}
    .row-label{width:100%; min-width:0}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *{transition:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="headbar">
    <div class="brand"><span class="dot"></span>Null7z</div>
    <div class="stat" id="stat">0 обоев показано</div>
  </div>
</header>

<section class="hero">
  <h1>Твой экран. Твой стиль.</h1>
  <p>Обои для Samsung, Apple и PC в высоком качестве. Выбирай устройство и категорию — открывай и скачивай.</p>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Поиск по категории, цвету, слову…">
  </div>
</section>

<div class="filters">
  <div class="row" id="deviceRow">
    <span class="row-label">Устройство</span>
    <button class="chip active" data-device="all">Все</button>
    <button class="chip" data-device="samsung">📱 Samsung</button>
    <button class="chip" data-device="apple">🍎 Apple</button>
    <button class="chip" data-device="pc">🖥️ PC</button>
  </div>
  <div class="row" id="categoryRow">
    <span class="row-label">Категория</span>
    <button class="chip active" data-cat="all">Все</button>
    <button class="chip" data-cat="dark">Dark</button>
    <button class="chip" data-cat="space">Космос</button>
    <button class="chip" data-cat="nature">Природа</button>
    <button class="chip" data-cat="city">Города</button>
    <button class="chip" data-cat="cars">Cars</button>
    <button class="chip" data-cat="abstract">Abstract</button>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Ничего не найдено по этому запросу.</div>
  <div class="more-wrap"><button class="more" id="more">Показать ещё</button></div>
</main>

<footer>Null7z © 2026 · Галерея генерируется динамически — обои подгружаются без ограничений</footer>

<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose">&times;</button>
  <img id="lbImg" src="" alt="">
  <div class="actions">
    <a class="dl2" id="lbDownload" download><button class="dl2">Скачать</button></a>
    <button class="close2" id="lbClose2">Закрыть</button>
  </div>
</div>

<script>
// Category -> seed pools give each category a stable, distinct-feeling set of images.
// Devices only change the crop/resolution requested, since this is a live generator, not a fixed 50k-file library.
const CATS = ['dark','space','nature','city','cars','abstract'];
const CAT_LABEL = {dark:'Dark',space:'Космос',nature:'Природа',city:'Города',cars:'Cars',abstract:'Abstract'};
const DEVICE_SIZE = {
  samsung: {w:1080, h:2340, cls:'phone', label:'Samsung · 1080×2340'},
  apple:   {w:1170, h:2532, cls:'phone', label:'Apple · 1170×2532'},
  pc:      {w:3840, h:2160, cls:'pc',    label:'PC · 3840×2160 4K'}
};
const DEVICES = ['samsung','apple','pc'];

let state = { device:'all', cat:'all', q:'', page:0, shown:0 };
const PAGE_SIZE = 24;

function seedFor(cat, device, index){
  // deterministic-but-varied seed so "search"/filters feel like a real indexed library
  return `n7z-${cat}-${device}-${index}`;
}

function buildBatch(){
  const cats = state.cat === 'all' ? CATS : [state.cat];
  const devices = state.device === 'all' ? DEVICES : [state.device];
  const items = [];
  for (let i = 0; i < PAGE_SIZE; i++){
    const cat = cats[(state.page * PAGE_SIZE + i) % cats.length];
    const device = devices[Math.floor((state.page * PAGE_SIZE + i) / cats.length) % devices.length];
    const idx = state.page * PAGE_SIZE + i;
    if (state.q && !(cat.includes(state.q) || CAT_LABEL[cat].toLowerCase().includes(state.q) || device.includes(state.q))) continue;
    items.push({cat, device, idx});
  }
  return items;
}

function cardHTML(item){
  const d = DEVICE_SIZE[item.device];
  const seed = seedFor(item.cat, item.device, item.idx);
  const thumb = `https://picsum.photos/seed/${seed}/${Math.round(d.w/3)}/${Math.round(d.h/3)}`;
  const full = `https://picsum.photos/seed/${seed}/${d.w}/${d.h}`;
  return `
    <div class="card ${d.cls}" data-full="${full}" data-name="null7z-${item.cat}-${item.device}-${item.idx}.jpg">
      <img loading="lazy" src="${thumb}" alt="${CAT_LABEL[item.cat]} обои для ${item.device}">
      <div class="overlay">
        <span class="tag">${CAT_LABEL[item.cat]} · ${d.label}</span>
        <div class="meta">
          <span>#${item.idx + 1}</span>
          <button class="dl" onclick="event.stopPropagation()"><a href="${full}" download="null7z-${item.idx}.jpg" style="color:inherit;text-decoration:none">Скачать</a></button>
        </div>
      </div>
    </div>`;
}

function render(reset){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (reset){ grid.innerHTML = ''; state.page = 0; state.shown = 0; }
  const items = buildBatch();
  if (items.length === 0 && state.shown === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    state.shown += items.length;
  }
  state.page++;
  document.getElementById('stat').textContent = `${state.shown} обоев показано`;
  bindCards();
}

function bindCards(){
  document.querySelectorAll('.card').forEach(card => {
    if (card.dataset.bound) return;
    card.dataset.bound = '1';
    card.addEventListener('click', () => openLightbox(card.dataset.full, card.dataset.name));
  });
}

function openLightbox(src, name){
  document.getElementById('lbImg').src = src;
  const dl = document.getElementById('lbDownload');
  dl.href = src; dl.setAttribute('download', name);
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lbClose').onclick = closeLightbox;
document.getElementById('lbClose2').onclick = closeLightbox;
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

document.getElementById('deviceRow').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  document.querySelectorAll('#deviceRow .chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.device = btn.dataset.device;
  render(true);
});
document.getElementById('categoryRow').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if (!btn) return;
  document.querySelectorAll('#categoryRow .chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.cat = btn.dataset.cat;
  render(true);
});
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = e.target.value.trim().toLowerCase();
    render(true);
  }, 250);
});
document.getElementById('more').addEventListener('click', () => render(false));

render(true);
</script>
</body>
</html>
