<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Null7z — 4K Wallpapers</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #050507;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(5, 5, 7, .88);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid #191a20;
}

.nav {
    max-width: 1500px;
    margin: auto;

    padding: 17px 5%;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 27px;
    font-weight: 950;
    letter-spacing: -1px;
}

.logo span {
    color: #8b5cf6;
}

.count {
    color: #777;
    border: 1px solid #24262e;
    padding: 8px 13px;
    border-radius: 50px;
    font-size: 12px;
}

/* =========================
   HERO
========================= */

.hero {
    max-width: 1500px;
    margin: auto;

    padding: 65px 5% 35px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(48px, 8vw, 100px);

    line-height: .88;

    letter-spacing: -6px;
}

.hero h1 span {
    color: #8b5cf6;
}

.hero p {
    max-width: 700px;

    margin-top: 27px;

    color: #85858b;

    font-size: 17px;
    line-height: 1.7;
}

/* =========================
   SEARCH
========================= */

.search {
    max-width: 1500px;
    margin: auto;

    padding: 0 5% 25px;
}

.search input {
    width: 100%;

    padding: 17px 20px;

    border-radius: 14px;

    border: 1px solid #252831;

    background: #0b0c10;

    color: white;

    outline: none;

    font-size: 15px;
}

.search input:focus {
    border-color: #8b5cf6;
}

/* =========================
   DEVICES
========================= */

.devices {
    max-width: 1500px;
    margin: auto;

    padding: 0 5% 15px;

    display: flex;
    flex-wrap: wrap;

    gap: 9px;
}

.device {
    border: 1px solid #252831;

    background: #0c0d11;

    color: #aaa;

    padding: 12px 17px;

    border-radius: 12px;

    cursor: pointer;

    transition: .2s;
}

.device:hover,
.device.active {
    background: #8b5cf6;

    border-color: #8b5cf6;

    color: white;
}

/* =========================
   CATEGORIES
========================= */

.categories {
    max-width: 1500px;
    margin: auto;

    padding: 0 5% 28px;

    display: flex;

    gap: 8px;

    overflow-x: auto;
}

.category {
    white-space: nowrap;

    background: #0b0c10;

    border: 1px solid #20232a;

    color: #999;

    padding: 9px 14px;

    border-radius: 10px;

    cursor: pointer;
}

.category:hover,
.category.active {
    color: white;

    border-color: #8b5cf6;
}

/* =========================
   GRID
========================= */

.grid {
    max-width: 1500px;

    margin: auto;

    padding: 0 5% 70px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));

    gap: 15px;
}

/* =========================
   CARD
========================= */

.card {
    height: 390px;

    position: relative;

    overflow: hidden;

    border-radius: 18px;

    background: #0b0c0f;

    border: 1px solid #191b22;

    cursor: pointer;
}

.card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: .5s;
}

.card:hover img {
    transform: scale(1.07);

    filter: brightness(.7);
}

.card::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 50%;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );
}

.info {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2;

    padding: 22px 17px;
}

.title {
    font-size: 17px;

    font-weight: 800;
}

.meta {
    color: #aaa;

    font-size: 10px;

    margin-top: 7px;
}

/* =========================
   LOAD MORE
========================= */

.load-area {
    text-align: center;

    padding: 0 20px 70px;
}

.load {
    background: #8b5cf6;

    border: none;

    color: white;

    padding: 14px 25px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 14px;

    font-weight: 700;
}

.load:hover {
    background: #7445e8;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.96);
}

.modal.show {
    display: flex;
}

.modal img {
    max-width: 96vw;

    max-height: 90vh;

    object-fit: contain;

    border-radius: 12px;
}

.close {
    position: fixed;

    top: 18px;
    right: 18px;

    width: 48px;
    height: 48px;

    border: 0;

    border-radius: 50%;

    background: #17181d;

    color: white;

    font-size: 30px;

    cursor: pointer;
}

.close:hover {
    background: #8b5cf6;
}

/* =========================
   FOOTER
========================= */

footer {
    border-top: 1px solid #181a20;

    text-align: center;

    color: #555;

    padding: 30px;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 600px) {

    .nav {
        padding: 15px 20px;
    }

    .count {
        display: none;
    }

    .hero {
        padding: 45px 20px 30px;
    }

    .hero h1 {
        font-size: 55px;

        letter-spacing: -4px;
    }

    .hero p {
        font-size: 14px;
    }

    .search {
        padding: 0 20px 20px;
    }

    .devices {
        padding-left: 20px;
        padding-right: 20px;
    }

    .categories {
        padding-left: 20px;
        padding-right: 20px;
    }

    .grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        padding-left: 12px;
        padding-right: 12px;

        gap: 9px;
    }

    .card {
        height: 285px;

        border-radius: 14px;
    }

    .info {
        padding: 16px 11px;
    }

    .title {
        font-size: 13px;
    }

    .meta {
        font-size: 9px;
    }
}

</style>
</head>


<body>


<!-- HEADER -->

<header>

<div class="nav">

<div class="logo">
Null<span>7z</span>
</div>

<div class="count">
50 000 WALLPAPERS
</div>

</div>

</header>


<!-- HERO -->

<section class="hero">

<h1>
Твой экран.<br>
<span>Твой стиль.</span>
</h1>

<p>
50 000 обоев для Samsung, Apple и PC.
Выбирай устройство, категорию и открывай
обои в высоком качестве.
</p>

</section>


<!-- SEARCH -->

<div class="search">

<input
id="search"
type="search"
placeholder="Поиск обоев..."
>

</div>


<!-- DEVICES -->

<div class="devices">

<button
class="device active"
data-device="all">

Все

</button>

<button
class="device"
data-device="samsung">

📱 Samsung

</button>

<button
class="device"
data-device="apple">

🍎 Apple

</button>

<button
class="device"
data-device="pc">

🖥️ PC

</button>

</div>


<!-- CATEGORIES -->

<div class="categories">

<button
class="category active"
data-category="all">

Все

</button>

<button
class="category"
data-category="dark">

Dark

</button>

<button
class="category"
data-category="space">

Космос

</button>

<button
class="category"
data-category="nature">

Природа

</button>

<button
class="category"
data-category="city">

Города

</button>

<button
class="category"
data-category="cars">

Cars

</button>

<button
class="category"
data-category="abstract">

Abstract

</button>

</div>


<!-- WALLPAPERS -->

<main
class="grid"
id="grid">
</main>


<div class="load-area">

<button
class="load"
id="load">

Показать ещё

</button>

</div>


<footer>

Null7z © 2026 • 50 000 Wallpapers

</footer>


<!-- MODAL -->

<div
class="modal"
id="modal">

<button
class="close"
id="close">

×

</button>

<img
id="big"
alt="Wallpaper"
>

</div>


<script>

/*
=================================================
  50 000 ОБОЕВ
=================================================

Мы НЕ храним 50 000 огромных картинок
в HTML.

Вместо этого создаём 50 000 карточек
с уникальным seed.

Картинка загружается только когда
браузеру она нужна.

Это намного быстрее.
*/


const TOTAL = 50000;

const BATCH = 40;

let visible = 40;

let device = "all";

let category = "all";

let search = "";


/*
=================================================
  КАТЕГОРИИ
=================================================
*/

const categories = [
    "dark",
    "space",
    "nature",
    "city",
    "cars",
    "abstract"
];


/*
=================================================
  НАЗВАНИЯ
=================================================
*/

const names = {

    dark: [
        "Black Shadow",
        "Dark Night",
        "Midnight",
        "Black Glass",
        "Obsidian",
        "Night Mode"
    ],

    space: [
        "Deep Space",
        "Galaxy",
        "Nebula",
        "Star Field",
        "Cosmic Night",
        "Universe"
    ],

    nature: [
        "Wild Forest",
        "Mountain",
        "Green Valley",
        "Ocean",
        "Sunset",
        "Misty Lake"
    ],

    city: [
        "Night City",
        "Neon Street",
        "Downtown",
        "City Lights",
        "Future City",
        "Night Drive"
    ],

    cars: [
        "Supercar",
        "Midnight Drive",
        "Luxury Car",
        "Street Racer",
        "Black Beast",
        "Performance"
    ],

    abstract: [
        "Abstract Flow",
        "Liquid",
        "Purple Wave",
        "Geometry",
        "Digital",
        "Minimal"
    ]

};


/*
=================================================
  DEVICE
=================================================
*/

function getDevice(index) {

    const devices = [
        "samsung",
        "apple",
        "pc"
    ];

    return devices[index % devices.length];

}


/*
=================================================
  CATEGORY
=================================================
*/

function getCategory(index) {

    return categories[
        index % categories.length
    ];

}


/*
=================================================
  IMAGE URL
=================================================

Picsum используется для демонстрации
большого каталога.

Каждая карточка получает свой seed.

Для реальной коллекции из 50 000 настоящих
4K-файлов можно заменить эту функцию
на CDN с твоими собственными изображениями.
*/

function getImage(index) {

    return `
https://picsum.photos/seed/null7z-${index}/1600/2560
`;

}


/*
=================================================
  TITLE
=================================================
*/

function getTitle(category, index) {

    const list = names[category];

    return list[
        index % list.length
    ];

}


/*
=================================================
  FILTER
=================================================
*/

function getItems() {

    const result = [];

    for (
        let i = 1;
        i <= TOTAL;
        i++
    ) {

        const itemDevice =
            getDevice(i);

        const itemCategory =
            getCategory(i);

        const title =
            getTitle(
                itemCategory,
                i
            );


        if (
            device !== "all" &&
            itemDevice !== device
        ) {
            continue;
        }


        if (
            category !== "all" &&
            itemCategory !== category
        ) {
            continue;
        }


        if (
            search &&
            !title
                .toLowerCase()
                .includes(
                    search.toLowerCase()
                )
        ) {
            continue;
        }


        result.push({
            id: i,
            device: itemDevice,
            category: itemCategory,
            title: title,
            image: getImage(i)
        });


        if (
            result.length >= visible
        ) {
            break;
        }

    }


    return result;

}


/*
=================================================
  RENDER
=================================================
*/

const grid =
    document.getElementById("grid");


function render() {

    grid.innerHTML = "";

    const items =
        getItems();


    if (!items.length) {

        grid.innerHTML = `
        <div
        style="
        grid-column:1/-1;
        text-align:center;
        padding:70px;
        color:#666;
        ">
        Ничего не найдено
        </div>
        `;

        return;

    }


    items.forEach(item => {

        const card =
            document.createElement(
                "article"
            );

        card.className = "card";


        card.innerHTML = `

        <img
            loading="lazy"
            src="${item.image}"
            alt="${item.title}"
        >

        <div class="info">

            <div class="title">
                ${item.title}
            </div>

            <div class="meta">
                ${item.device.toUpperCase()}
                • 4K
                • #${item.id}
            </div>

        </div>

        `;


        card.onclick = () => {

            document
                .getElementById("big")
                .src = item.image;

            document
                .getElementById("modal")
                .classList
                .add("show");

        };


        grid.appendChild(card);

    });

}


/*
=================================================
  DEVICE BUTTONS
=================================================
*/

document
.querySelectorAll(".device")
.forEach(button => {

    button.onclick = () => {

        document
        .querySelectorAll(".device")
        .forEach(
            x =>
            x.classList.remove(
                "active"
            )
        );


        button
        .classList
        .add("active");


        device =
            button.dataset.device;


        visible = BATCH;


        render();

    };

});


/*
=================================================
  CATEGORY BUTTONS
=================================================
*/

document
.querySelectorAll(".category")
.forEach(button => {

    button.onclick = () => {

        document
        .querySelectorAll(".category")
        .forEach(
            x =>
            x.classList.remove(
                "active"
            )
        );


        button
        .classList
        .add("active");


        category =
            button.dataset.category;


        visible = BATCH;


        render();

    };

});


/*
=================================================
  SEARCH
=================================================
*/

document
.getElementById("search")
.addEventListener(
    "input",
    event => {

        search =
            event.target.value;

        visible = BATCH;

        render();

    }
);


/*
=================================================
  LOAD MORE
=================================================
*/

document
.getElementById("load")
.onclick = () => {

    visible += BATCH;

    render();

};


/*
=================================================
  MODAL
=================================================
*/

const modal =
    document.getElementById("modal");

const close =
    document.getElementById("close");


close.onclick = () => {

    modal.classList
        .remove("show");

};


modal.onclick = event => {

    if (
        event.target === modal
    ) {

        modal.classList
            .remove("show");

    }

};


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            modal.classList
                .remove("show");

        }

    }
);


/*
=================================================
  START
=================================================
*/

render();

</script>

</body>
</html>
